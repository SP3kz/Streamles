name: OMEGA-Surge Python App CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt || echo "No requirements.txt found"
        pip install streamlit pandas flake8 pytest requests

    - name: Lint Code with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run Tests with pytest
      run: |
        echo "Running tests from ./tests/"
        pytest tests/ --verbose

    - name: Build Docker Image
      run: |
        docker build -t omega-surge-app .

    - name: Validate Streamlit App Headless
      run: |
        nohup streamlit run streamlit_app.py --server.headless true > streamlit.log 2>&1 &
        sleep 10
        echo "Streamlit started in background for test validation."

    - name: Send Webhook to Flowly (Trigger Sync/Notify)
      run: |
        curl -X POST https://flowly.app/webhook/omega-surgesync -H 'Content-Type: application/json' -d '{"status":"deployed","timestamp":"$(date -u)"}'

    - name: Auto-Tag Version
      run: |
        git config --global user.email "actions@github.com"
        git config --global user.name "github-actions"
        git tag "v1.0.$(date +%s)"
        git push origin --tags

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        name: OMEGA Surge Auto Release
        tag_name: v1.0.${{ github.run_number }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
